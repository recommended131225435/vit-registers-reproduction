# Runs our unit tests and the forward-pass check (on random data) on every push,
# so a broken change is spotted immediately. Uses the CPU version of PyTorch.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy matplotlib pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Forward-pass check on random data
        run: python -m scripts.check_forward_pass --fake
